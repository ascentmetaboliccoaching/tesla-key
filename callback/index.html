<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KingServer Tesla callback</title></head>
<body style="font-family:sans-serif;max-width:40em;margin:2em auto;padding:0 1em"><h1>Tesla sign-in finished</h1><p>Copy this code and send it to SynKing:</p>
